[package]
name = "lode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, cross-platform binary package manager with a GitHub-friendly registry"
license = "MIT"
readme = "README.md"
repository = "https://github.com/spdedsec/lode"
keywords = ["package-manager", "cli", "installer", "registry", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
zip = { version = "6", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
tempfile = "3"
